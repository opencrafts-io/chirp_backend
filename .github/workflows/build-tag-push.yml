name: Build, Push, and Update Chirp Backend

on:
  push:
    branches:
      - main
      - staging

jobs:
  build-push-update:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout Chirp Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django tests
        id: django_tests
        run: |
          mkdir -p test-results
          python manage.py test 2>&1 | tee test-results/django-test-output.txt

      - name: Install pack CLI
        run: |
          curl -sSL "https://github.com/buildpacks/pack/releases/download/v0.38.2/pack-v0.38.2-linux.tgz" | tar -xz
          sudo mv pack /usr/local/bin/pack

      - name: Cache CNB Layers
        uses: actions/cache@v4
        with:
          path: ~/.cache/pack
          key: cnb-${{ runner.os }}-${{ github.ref }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            cnb-${{ runner.os }}-${{ github.ref }}
            cnb-${{ runner.os }}

      - name: Set Docker Tags
        id: tags
        run: |
          BRANCH=$(echo "${GITHUB_REF##*/}" | tr '[:upper:]' '[:lower:]' | tr '/' '-')
          SHA=$(git rev-parse --short HEAD)

          if [ "$BRANCH" = "main" ]; then
            IMAGE_TAG="prod"
            IMAGE_BASE="${{ secrets.DOCKERHUB_USERNAME }}/chirp-backend-prod"
          else
            IMAGE_TAG="dev"
            IMAGE_BASE="${{ secrets.DOCKERHUB_USERNAME }}/chirp-backend-staging"
          fi

          echo "image_base=$IMAGE_BASE" >> $GITHUB_OUTPUT
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "sha_tag=$SHA" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Chirp Image with Buildpacks
        run: |
          IMAGE_BASE=${{ steps.tags.outputs.image_base }}
          IMAGE_TAG=${{ steps.tags.outputs.image_tag }}
          SHA_TAG=${{ steps.tags.outputs.sha_tag }}

          echo "🔨 Building $IMAGE_BASE:$IMAGE_TAG and $IMAGE_BASE:$SHA_TAG"

          pack build "$IMAGE_BASE:$IMAGE_TAG" \
            --buildpack paketo-buildpacks/python \
            --builder paketobuildpacks/builder-jammy-base \
            --env BP_CPYTHON_VERSION=3.12.* \
            --cache "type=build;format=volume"

          docker tag "$IMAGE_BASE:$IMAGE_TAG" "$IMAGE_BASE:$SHA_TAG"

      - name: Push Chirp Images
        run: |
          IMAGE_BASE=${{ steps.tags.outputs.image_base }}
          IMAGE_TAG=${{ steps.tags.outputs.image_tag }}
          SHA_TAG=${{ steps.tags.outputs.sha_tag }}

          echo "Pushing $IMAGE_BASE:$IMAGE_TAG"
          docker push "$IMAGE_BASE:$IMAGE_TAG"

          echo "Pushing $IMAGE_BASE:$SHA_TAG"
          docker push "$IMAGE_BASE:$SHA_TAG"

      - name: Checkout InfraOps Repo
        uses: actions/checkout@v4
        with:
          repository: opencrafts-io/infraops
          token: ${{ secrets.GH_TOKEN }}
          ref: main
          path: infraops

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Compute deployment file path
        id: target
        run: |
          BRANCH="${GITHUB_REF_NAME#refs/heads/}"
          if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "master" ]; then
            DIR="infraops/services/chirp"
          else
            DIR="infraops/qaservices/chirp"
          fi
          echo "file=$DIR/deployment.yaml" >> "$GITHUB_OUTPUT"
          echo "worker_file=$DIR/worker-deployment.yaml" >> "$GITHUB_OUTPUT"
          echo "Deployment file: $DIR/deployment.yaml"
          echo "Worker deployment file: $DIR/worker-deployment.yaml"

      - name: Update deployment.yaml
        run: |
          IMAGE="${{ steps.tags.outputs.image_base }}:${{ steps.tags.outputs.sha_tag }}"
          for FILE in "${{ steps.target.outputs.file }}" "${{ steps.target.outputs.worker_file }}"; do
            echo "Updating $FILE with image: $IMAGE"
            if [ ! -f "$FILE" ]; then
              echo "ERROR: $FILE does not exist!"
              ls -la "$(dirname $FILE)"
              exit 1
            fi
            echo "Old image:"
            yq eval '.spec.template.spec.containers[0].image' "$FILE"
            yq eval ".spec.template.spec.containers[0].image = \"$IMAGE\"" -i "$FILE"
            echo "New image:"
            yq eval '.spec.template.spec.containers[0].image' "$FILE"
          done

      - name: Commit and push changes
        run: |
          cd infraops
          IMAGE="${{ steps.tags.outputs.image_base }}:${{ steps.tags.outputs.sha_tag }}"
          git config user.name "CI Bot from Github Actions"
          git config user.email "actions@github.com"

          if [ "${{ github.ref_name }}" = "main" ] || [ "${{ github.ref_name }}" = "master" ]; then
            DIR="services/chirp"
          else
            DIR="qaservices/chirp"
          fi

          git add "$DIR/deployment.yaml" "$DIR/worker-deployment.yaml"
          git commit -m "chore: update chirp image to $IMAGE (${{ github.ref_name }})"
          git push origin main
